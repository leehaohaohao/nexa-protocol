syntax = "proto3";

package nexa_protocol;
option go_package = "github.com/leehaohaohao/nexa-protocol/go/messages";
option java_package = "com.nexa.protocol";
enum MessageType {

  UNKNOWN = 0;

  REGISTER_REQ = 1;
  REGISTER_RESP = 2;

  HEARTBEAT_REQ = 3;
  HEARTBEAT_RESP = 4;

  DISCONNECT_REQ = 5;

  TASK_DISPATCH_REQ = 6;

  TASK_DISPATCH_RESP = 7;

  CONTAINER_STATUS_REQ = 8;

  CONTAINER_STATUS_RESP = 9;

  CONTAINER_LOGS_REQ = 10;

  CONTAINER_LOGS_RESP = 11;

}